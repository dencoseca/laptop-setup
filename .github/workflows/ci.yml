name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Keep this name stable: main branch protection requires this context.
    name: Test, vet, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the runbook structure
        run: |
          test -f README.md
          test "$(grep -Ec '^## [1-9]\. ' README.md)" -eq 9
          test "$(grep -Ec '^```' README.md)" -gt 0
          test "$(( $(grep -Ec '^```' README.md) % 2 ))" -eq 0

      - name: Check shell block syntax
        run: |
          awk '
            /^```shell$/ { in_block = 1; next }
            /^```$/ {
              if (in_block) {
                in_block = 0
                print ""
              }
              next
            }
            in_block
          ' README.md | bash -n

          awk '
            /^```shell$/ { in_block = 1; next }
            /^```$/ {
              if (in_block) {
                in_block = 0
                print ""
              }
              next
            }
            in_block
          ' README.md | zsh -n

      - name: Check whitespace
        run: git diff-tree --check --root HEAD
